fullnameOverride: "pedro"

replicaCount: 1

image:
  pullPolicy: Always

discordBot:
  enabled: true
  openbaoInjection: true
  image:
    repository: 100.81.89.62:5000/pedro-discord
    tag: df12033
  env:
    - name: MODEL
      value: "qwen3.6-27b-mtp"
    - name: LLAMA_CPP_PATH
      value: "http://100.121.229.114:8000"

twitchBot:
  enabled: true
  tailscaleIngress: true
  openbaoInjection: false
  image:
    repository: 100.81.89.62:5000/pedro-twitch
    tag: fix-lo-db
  env:
    - name: MODEL
      value: "qwen3.6-27b-mtp"
    - name: LLAMA_CPP_PATH
      value: "http://100.121.229.114:8000"
    - name: POSTGRES_URL
      value: "postgres://postgres:password@postgres.chatbot.svc.cluster.local:5432/postgres?sslmode=disable"
    - name: OAUTH_REDIRECT_HOST
      value: "chatbot-pedro-twitch-auth-ingress.tail6fbc5.ts.net"
  # Disable failing embed sidecar - use existing pedro-embeddings service instead
  embedSidecar:
    enabled: false
  args: []
  resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "1Gi"
  volumes: []

mempalace:
  enabled: false
  openbaoInjection: true
  image:
    repository: 100.81.89.62:5000/pedro-mempalace
    tag: dbca760
  volume:
    # PVC size for the mem-palace data (defaults to 1Gi if omitted).
    storageSize: 1Gi

keepalive:
  enabled: true
  openbaoInjection: false
  image:
    repository: 100.81.89.62:5000/pedro-keepalive
    tag: fix-lo-db
  env:
    - name: DISCORD_BOT_URL
      value: "http://pedro-discord:6060/healthz"
    - name: TWITCH_BOT_URL
      value: "http://pedro-twitch:6060/healthz"
    - name: TWITCH_BOT_AUTH_URL
      value: "http://pedro-twitch:6060/healthz/auth"
    - name: LLAMA_CPP_PATH
      value: "http://100.121.229.114:8000"
    - name: CHECK_INTERVAL
      value: "60"
    - name: ALERT_INTERVAL
      value: "3600"

# Secrets populated by deploy.sh via 1Password CLI
secrets:
  twitchId: "lntr8hv9u20824hlfp2sztalbp6vg6"
  twitchSecret: "qku834bai2n47ik62nkh6mcgi9fxeq"
  # twitchToken: ""  # Removed to trigger OAuth flow for user token
  postgresUrl: "postgres://postgres:password@postgres.chatbot.svc.cluster.local:5432/postgres?sslmode=disable"
  postgresVectorUrl: ""
  discordSecret: ""
  discordClientId: ""
  discordPublicKey: ""
  discordPermission: ""
  supabasePubKey: ""
  supabasePrivKey: ""
  supabaseUrl: ""
  supabaseJwt: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
tolerations: []
affinity: {}