fullnameOverride: "pedro"

replicaCount: 1

image:
  pullPolicy: Always

discordBot:
  enabled: true
  openbaoInjection: true
  image:
    repository: 100.81.89.62:5000/pedro-discord
    tag: df12033
  env:
    - name: MODEL
      value: "qwen3.6-27b-mtp"
    - name: LLAMA_CPP_PATH
      value: "http://100.121.229.114:8080"

twitchBot:
  enabled: true
  tailscaleIngress: true
  openbaoInjection: true
  image:
    repository: 100.81.89.62:5000/pedro-twitch
    tag: mem-palace
  env:
    - name: MODEL
      value: "qwen3.6-27b-mtp"
    - name: LLAMA_CPP_PATH
      value: "http://100.121.229.114:8080"
    # Use existing pedro-embeddings service instead of in-pod sidecar
    - name: EMBEDDINGS_PATH
      value: "http://pedro-embeddings.chatbot.svc.cluster.local:8081/v1"
    - name: EMBEDDINGS_MODEL
      value: "sentence-transformers/all-MiniLM-L6-v2"
    - name: OAUTH_REDIRECT_HOST
      value: "chatbot-pedro-twitch-auth-ingress.tail6fbc5.ts.net"
    - name: MEMPALACE_DATA_DIR
      value: "/data/palaces"
  # Disable failing embed sidecar - use existing pedro-embeddings service instead
  embedSidecar:
    enabled: false
  args:
    - "-enableMemPalace"
    - "-memPalaceActiveDir"
    - "/data/palaces/active"
    - "-memPalaceArchiveDir"
    - "/data/palaces/archive"
  resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "1Gi"
  volumes:
    - name: palace-data
      mountPath: /data/palaces
      readOnly: false
      claimName: pedro-palaces

mempalace:
  enabled: true
  openbaoInjection: true
  image:
    repository: 100.81.89.62:5000/pedro-mempalace
    tag: dbca760
  volume:
    # PVC size for the mem-palace data (defaults to 1Gi if omitted).
    storageSize: 1Gi

keepalive:
  enabled: true
  openbaoInjection: false
  image:
    repository: 100.81.89.62:5000/pedro-keepalive
    tag: df12033
  env:
    - name: DISCORD_BOT_URL
      value: "http://pedro-discord:6060/healthz"
    - name: TWITCH_BOT_URL
      value: "http://pedro-twitch:6060/healthz"
    - name: TWITCH_BOT_AUTH_URL
      value: "http://pedro-twitch:6060/healthz/auth"
    - name: LLAMA_CPP_PATH
      value: "http://100.121.229.114:8080"
    - name: CHECK_INTERVAL
      value: "60"
    - name: ALERT_INTERVAL
      value: "3600"

# Secrets populated by deploy.sh via 1Password CLI
secrets:
  twitchId: ""
  twitchSecret: ""
  postgresUrl: ""
  postgresVectorUrl: ""
  discordSecret: ""
  discordClientId: ""
  discordPublicKey: ""
  discordPermission: ""
  supabasePubKey: ""
  supabasePrivKey: ""
  supabaseUrl: ""
  supabaseJwt: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
tolerations: []
affinity: {}